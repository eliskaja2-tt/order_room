<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>住宿推薦・綜合評分與距離</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1c2b2a;--mute:#66736f;--line:#dbe2de;--pine:#0f5c4d;--best:#c2410c;--bestbg:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#121a19;--card:#1a2523;--ink:#e8efec;--mute:#93a39e;--line:#2c3a37;--pine:#4fc3a9;--best:#ffa56b;--bestbg:#33241a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:940px;margin:0 auto;padding:24px 16px 70px}
h1{font-size:26px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:10px}.row:first-child{margin-top:0}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
input,select,button{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{cursor:pointer}#q{min-width:260px;flex:1}
.go{background:var(--pine);color:var(--bg);border-color:var(--pine);font-weight:600}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0}.seg button[aria-pressed=true]{background:var(--pine);color:var(--bg);font-weight:600}
.note{font-size:13px;color:var(--mute);margin:12px 0}
.warn{border-left:4px solid var(--best);padding:8px 12px;background:var(--bestbg);font-size:13px;border-radius:0 8px 8px 0;margin:12px 0}
.hotel{display:grid;grid-template-columns:1fr auto;gap:6px 16px;cursor:pointer;width:100%}.hotel:hover{border-color:var(--pine)}
.hname{font-weight:700;font-size:17px}.meta{color:var(--mute);font-size:13px}
.rk{text-align:right}.rk b{font-size:24px;color:var(--best)}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.cta{display:inline-block;background:var(--pine);color:var(--bg);padding:7px 13px;border-radius:8px;font-weight:600;text-decoration:none;font-size:14px;margin:4px 6px 4px 0}
.cta.alt{background:transparent;color:var(--pine);border:1px solid var(--pine)}
h3{margin:18px 0 6px;font-size:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pine);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}#toast.on{opacity:1}
.fine{font-size:12px;color:var(--mute);margin-top:10px}
</style>
</head>
<body>
<main>
<h1>住宿推薦・綜合評分與距離</h1>
<p class="sub">依各訂房網評分與車站距離排出推薦順序；點進住宿，再前往各平台確認報價。</p>

<div class="panel">
  <div class="row">
    <label style="flex:1">地點／車站<input id="q" placeholder="輸入地點或車站，例如：箱根湯本車站" autocomplete="off"></label>
    <label>入住<input type="date" id="ci"></label>
    <label>退房<input type="date" id="co"></label>
    <label>人數<select id="ppl"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
    <button class="go" id="go">搜尋</button>
  </div>
  <div class="row">
    <label>排序方式<div class="seg" id="sortseg"><button data-m="rec" aria-pressed="true">推薦排序</button><button data-m="dist" aria-pressed="false">依距離</button><button data-m="rate" aria-pressed="false">依評分</button></div></label>
    <label>推薦權重<select id="wt"><option value="0.7">評分優先</option><option value="0.5" selected>評分與距離平衡</option><option value="0.3">距離優先</option></select></label>
    <label>複製的名稱<select id="cn"><option value="en">英文名稱</option><option value="l">原文名稱（有資料時）</option></select></label>
  </div>
</div>
<div id="out"><p class="note">請輸入地點後按「搜尋」。目前內建「箱根湯本車站」的整理結果。</p></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// 整理自 Booking.com、Expedia、Trip.com、Rakuten Travel 等頁面（2026-11-26 查詢）。評分為 10 分制；距離為車站到住宿，部分由步行時間估算（~）。
const AREA={name:"箱根湯本車站",re:/箱根|湯本|hakone|yumoto/i,date:"2026-11-26"};
const H=[
{n:"Yumoto Fujiya Hotel",l:"湯本富士屋ホテル",st:4,d:200,r:{Expedia:[9.0,1000]}},
{n:"Hotel Kajikaso",l:"ホテル河鹿荘",st:4,d:300,r:{Expedia:[8.8,325]}},
{n:"Hotel Zagakukan",l:"",st:2.5,d:400,r:{"Booking.com":[9.1,600],Expedia:[9.8,76]},note:"步行約 6 分鐘"},
{n:"Hako Reiro",l:"",st:4.5,d:400,r:{},note:"尚未取得評分"},
{n:"Bansuirou Fukuzumi",l:"萬翠楼 福住",st:0,d:400,est:1,r:{},note:"步行約 5 分鐘；尚未取得評分"},
{n:"STAGIONE Hakone Yumoto",l:"",st:3,d:500,r:{Expedia:[9.8,16]},note:"評論數少"},
{n:"Tsukino Yado Sara",l:"月の宿 紗羅",st:4,d:600,est:1,r:{Expedia:[9.2,222],"Trip.com":[9.0,62],"Rakuten":[8.6,532]},note:"各平台標示 2～10 分鐘步行不一，距離為估計；Rakuten 為 4.3／5 換算"},
{n:"Hakonowa",l:"",st:0,d:650,est:1,r:{},note:"步行約 8 分鐘；尚未取得評分"},
{n:"LUX HAKONE YUMOTO",l:"",st:5,d:700,r:{Expedia:[10.0,5]},note:"評論數極少"},
{n:"MEIBI Hakone Yumoto",l:"",st:3,d:900,est:1,r:{Expedia:[9.6,19]},note:"步行約 12 分鐘；評論數少"}
];
H.forEach(h=>{const v=Object.values(h.r);h.n_=v.reduce((a,b)=>a+b[1],0);
 h.raw=v.length?v.reduce((a,b)=>a+b[0]*b[1],0)/h.n_:null;           // 以評論數加權平均
 h.adj=h.raw==null?null:(h.raw*h.n_+8*30)/(h.n_+30)});            // 向 8.0 收斂：評論少者不虛高
const $=s=>document.querySelector(s),out=$("#out");
let sortMode="rec",show=false;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.toISOString().slice(0,10);
const t0=new Date();t0.setDate(t0.getDate()+14);$("#ci").value=iso(t0);t0.setDate(t0.getDate()+1);$("#co").value=iso(t0);
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3500)}
function copyText(t){const ok=()=>toast("已複製：「"+t+"」，到訂房網貼上即可搜尋");
 const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toast("請手動複製："+t)}a.remove()};
 navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(ok,fb):fb()}
document.addEventListener("click",e=>{const a=e.target.closest("a[data-copy]");if(a){const h=H[+a.dataset.copy];copyText($("#cn").value==="l"&&h.l?h.l:h.n)}else{const b=e.target.closest("a[data-q]");if(b)copyText(b.dataset.q)}});

function links(term){const n=encodeURIComponent(term),ci=$("#ci").value,co=$("#co").value,g=$("#ppl").value,nn=Math.max(1,Math.round((new Date(co)-new Date(ci))/864e5));
 return [["Google Hotels","https://www.google.com/travel/search?q="+n],
 ["Trip.com",`https://www.trip.com/hotels/list?keyword=${n}&checkin=${ci}&checkout=${co}&adult=${g}`],
 ["Booking.com",`https://www.booking.com/searchresults.html?ss=${n}&checkin=${ci}&checkout=${co}&group_adults=${g}&no_rooms=1`],
 ["Agoda",`https://www.agoda.com/search?textToSearch=${n}&checkIn=${ci}&los=${nn}&rooms=1&adults=${g}`],
 ["Expedia",`https://www.expedia.com/Hotel-Search?destination=${n}&startDate=${ci}&endDate=${co}&adults=${g}`]]}

function score(h){const w=+$("#wt").value;
 const rn=h.adj==null?.3:Math.max(0,Math.min(1,(h.adj-7)/3)),dn=Math.max(0,1-h.d/1000);
 return(w*rn+(1-w)*dn)*100}
function search(){
 const q=$("#q").value.trim();
 if(!q){out.innerHTML='<p class="note">請先輸入地點或車站。</p>';return}
 if(!AREA.re.test(q)){
  out.innerHTML=`<div class="panel"><div class="hname">「${esc(q)}」尚無整理好的推薦</div>
  <p class="meta">目前內建的推薦清單只有「${AREA.name}」。其他地點可以直接用下列免費連結，在各平台搜尋附近住宿：</p>
  ${links(q+" hotels").map(([n,u])=>`<a class="cta" target="_blank" rel="noopener noreferrer" href="${esc(u)}">${n}</a>`).join("")}
  <a class="cta alt" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/${encodeURIComponent("hotels near "+q)}">Google 地圖</a></div>`;return}
 show=true;render()}
function render(){
 if(!show)return;
 const L=H.map((h,i)=>({h,i,sc:score(h)}));
 if(sortMode==="rec")L.sort((a,b)=>b.sc-a.sc);
 if(sortMode==="dist")L.sort((a,b)=>a.h.d-b.h.d);
 if(sortMode==="rate")L.sort((a,b)=>(b.h.adj??0)-(a.h.adj??0));
 const how={rec:"依推薦指數（評分＋距離）",dist:"依距離由近到遠",rate:"依評分高到低（評論少者會向平均收斂）"}[sortMode];
 out.innerHTML=`<p class="note">${AREA.name}附近 10 間住宿・${how}。資料整理於 ${AREA.date}。點選住宿查看平台連結。</p>`+
 L.map((x,k)=>{const h=x.h;
  return `<div class="panel hotel" role="button" tabindex="0" data-i="${x.i}">
  <div><div class="hname">${esc(h.n)}</div>${h.l?`<div class="meta">${esc(h.l)}</div>`:""}
   <div class="meta">距車站${h.est?"約 ":" "}${h.d}m${h.st?" ・ "+h.st+" 星":""}</div></div>
  <div class="rk"><div class="meta">${sortMode==="rec"?"推薦 #"+(k+1)+"・指數":"評分"}</div><b>${sortMode==="rec"?Math.round(x.sc):(h.raw==null?"—":h.raw.toFixed(1))}</b>${sortMode==="rec"&&h.raw!=null?`<div class="meta">平台評分 ${h.raw.toFixed(1)}／10</div>`:""}</div>
  <div class="chips">${Object.entries(h.r).map(([s,v])=>`<span class="chip">${esc(s)} ${v[0]}（${v[1]} 則）</span>`).join("")||'<span class="chip">評分未取得，請到平台查看</span>'}</div></div>`}).join("");
 out.querySelectorAll(".hotel").forEach(b=>{const go=e=>{if(e.target.closest("a"))return;detail(+b.dataset.i)};b.onclick=go;b.onkeydown=e=>e.key==="Enter"&&go(e)});
}
function detail(i){
 const h=H[i];
 out.innerHTML=`<p><button id="bk">← 返回列表</button></p><div class="panel">
 <div class="hname">${esc(h.n)}</div>${h.l?`<div class="meta">${esc(h.l)}</div>`:""}
 <div class="meta">距${AREA.name}${h.est?"約 ":" "}${h.d}m${h.st?" ・ "+h.st+" 星":""}${h.note?" ・ "+esc(h.note):""}</div>
 <h3>各平台評分（10 分制）</h3>
 <div class="chips" style="border:0;padding:0">${Object.entries(h.r).map(([s,v])=>`<span class="chip">${esc(s)} ${v[0]}（${v[1]} 則）</span>`).join("")||'<span class="chip">評分未取得</span>'}</div>
 ${h.raw!=null?`<div class="meta" style="margin-top:6px">加權平均 ${h.raw.toFixed(2)}；排序用的收斂後評分 ${h.adj.toFixed(2)}</div>`:""}
 <h3>前往平台確認報價（${esc($("#ci").value)} ～ ${esc($("#co").value)}・${$("#ppl").value} 位）</h3>
 <p class="meta">點下去會同時複製飯店名稱，到平台搜尋框貼上即可。這些是平台的搜尋頁，請確認房型是 2 人房、禁菸，並看結帳頁的含稅總價。</p>
 ${links(h.n+" Hakone").map(([n,u])=>`<a class="cta" data-copy="${i}" target="_blank" rel="noopener noreferrer" href="${esc(u)}">${n}</a>`).join("")}
 <a class="cta alt" data-copy="${i}" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(h.n+" 官方網站")}">官方網站</a>
 <p class="fine">評分資料來自各平台公開頁面的整理，不同平台評論數與更新時間不同，僅供排序參考。</p></div>`;
 $("#bk").onclick=render;window.scrollTo(0,0)}
document.querySelectorAll("#sortseg button").forEach(b=>b.onclick=()=>{sortMode=b.dataset.m;document.querySelectorAll("#sortseg button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()});
$("#wt").onchange=render;$("#go").onclick=search;$("#q").onkeydown=e=>e.key==="Enter"&&search();$("#q").focus();
</script>
</body>
</html>
