<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>住宿比價 · 含稅總價</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#1c2b2a;--mute:#66736f;--line:#dbe2de;--pine:#0f5c4d;--best:#c2410c;--bestbg:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#121a19;--card:#1a2523;--ink:#e8efec;--mute:#93a39e;--line:#2c3a37;--pine:#4fc3a9;--best:#ffa56b;--bestbg:#33241a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
input,select,button{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
#q{min-width:260px;flex:1}
button.go{background:var(--pine);color:var(--bg);border-color:var(--pine);cursor:pointer;font-weight:600}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.chk{flex-direction:row;align-items:center;gap:6px}
.note{font-size:13px;color:var(--mute);margin:12px 0}
.hotel{display:grid;grid-template-columns:1fr auto;gap:8px 16px;margin-top:12px;cursor:pointer;text-align:left;width:100%;color:inherit}
.hotel:hover{border-color:var(--pine)}
.hname{font-weight:700;font-size:17px}
.meta{color:var(--mute);font-size:13px}
.best{text-align:right}
.best b{font-size:22px;color:var(--best)}
.plat{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.plat span.lo{color:var(--best);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
td.min{background:var(--bestbg);color:var(--best);font-weight:700}
.scroll{overflow-x:auto}
.back{cursor:pointer;margin-bottom:10px}
.tag{font-size:12px;background:var(--bestbg);color:var(--best);padding:1px 7px;border-radius:99px;margin-left:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;border-radius:0;cursor:pointer}.seg button[aria-pressed=true]{background:var(--pine);color:var(--bg);font-weight:600}
.cta{display:inline-block;margin-top:6px;background:var(--pine);color:var(--bg);padding:6px 12px;border-radius:8px;font-weight:600;text-decoration:none;font-size:14px}
.plat a{color:inherit}.plat a:hover{text-decoration:underline}th a{color:inherit}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pine);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}#toast.on{opacity:1}
.fine{font-size:12px;color:var(--mute);margin-top:6px}
.warn{border-left:4px solid var(--best);padding:8px 12px;background:var(--bestbg);font-size:13px;border-radius:0 8px 8px 0;margin-bottom:14px}
</style>
</head>
<body>
<main>
<h1>住宿比價・含稅總價</h1>
<p class="sub">輸入車站或地標，列出最近 10 間住宿，並比較各訂房網的最終總價。</p>
<div class="warn">目前為示範版：價格為內建範例資料（非即時報價）。要顯示真實價格，需串接訂房平台的 API 或比價資料服務（見頁尾說明）。</div>

<div class="panel">
  <div class="row">
    <label style="flex:1">地點／車站<input id="q" value="箱根湯本車站" placeholder="例如：箱根湯本車站" list="sug"></label>
    <datalist id="sug"><option value="箱根湯本車站"></datalist>
    <label>入住<input type="date" id="ci"></label>
    <label>退房<input type="date" id="co"></label>
    <label>人數<select id="ppl"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
    <button class="go" id="go">搜尋</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label class="chk"><input type="checkbox" id="ns" checked> 僅禁菸房</label>
    <label class="chk"><input type="checkbox" id="fc"> 僅顯示免費取消</label>
  </div>
  <div class="row" style="margin-top:10px">
    <label>複製的名稱<select id="cn"><option value="en">英文名稱</option><option value="l">原文名稱</option></select></label>
    <label>排序方式<div class="seg" id="sortseg"><button data-m="dist" aria-pressed="true">依距離</button><button data-m="rate" aria-pressed="false">依評分</button></div></label>
    <label>評分來源<select id="rsrc"><option value="avg">綜合平均（三個來源）</option><option value="g">Google 地圖</option><option value="b">Booking.com</option><option value="a">Agoda</option></select></label>
  </div>
</div>

<div id="out"></div>
<p class="fine">點連結時會同時複製飯店名稱。連結會帶入日期與人數前往各平台的搜尋頁，實際房價請以平台頁面為準。價格計算：標示「未含稅」的平台加計消費稅 10%、服務費；各平台另加入湯稅（箱根每人每晚約 NT$30，依實際匯率而定）。實際結帳金額以訂房網站為準。</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const PLAT=[
 {id:"trip",name:"Trip.com",f:0.87,taxInc:true,svc:0},
 {id:"booking",name:"Booking.com",f:1.15,taxInc:false,svc:0},
 {id:"agoda",name:"Agoda",f:1.04,taxInc:false,svc:0},
 {id:"ikyu",name:"Ikyu.com",f:1.00,taxInc:true,svc:0},
 {id:"official",name:"官方網站",f:0.90,taxInc:true,svc:0}
];
const ROOMS=[
 {n:"標準雙人房（禁菸）",m:1,smoke:false,fc:true},
 {n:"和洋室（禁菸）",m:1.28,smoke:false,fc:true},
 {n:"附私人露天風呂客房（禁菸）",m:1.95,smoke:false,fc:false},
 {n:"含早晚餐方案雙人房（禁菸）",m:1.75,smoke:false,fc:false},
 {n:"標準雙人房（可吸菸）",m:0.95,smoke:true,fc:true}
];
// 示範資料：base = 每晚雙人標準房 NT$（未含稅基準），dist = 距車站公尺（示範值）
const HOTELS=[
 {n:"Hotel Kajikaso",l:"ホテル河鹿荘",d:350,b:4700,star:4.2},
 {n:"Yumoto Fujiya Hotel",l:"湯本富士屋ホテル",d:480,b:6900,star:4.3},
 {n:"Yaeikan",l:"箱根湯本温泉 弥栄館",d:520,b:5200,star:4.0},
 {n:"Hotel Okada",l:"ホテルおかだ",d:640,b:8800,star:4.1},
 {n:"Fukuzumirou",l:"福住楼",d:700,b:9400,star:4.5},
 {n:"Hakone Ichinoyu Honkan",l:"箱根湯本温泉 一の湯 本館",d:760,b:5600,star:4.0},
 {n:"Ryokan Sakura",l:"旅館さくら",d:830,b:4300,star:3.9},
 {n:"Tenseien",l:"箱根湯本 天成園",d:910,b:6200,star:4.2},
 {n:"Ryokan Hanabishi",l:"旅館花菱",d:1100,b:7600,star:4.3},
 {n:"Guest House Tsuta",l:"ゲストハウス蔦",d:1250,b:3200,star:3.8}
];
// 示範評分：g=Google 地圖(滿分5)、b=Booking.com(滿分10)、a=Agoda(滿分10)
const RT=[{g:4.2,b:8.6,a:8.7,gn:1840},{g:4.3,b:8.8,a:8.9,gn:2960},{g:4.0,b:8.3,a:8.4,gn:1210},{g:4.1,b:8.5,a:8.4,gn:980},{g:4.5,b:9.1,a:9.2,gn:1530},{g:4.0,b:8.2,a:8.3,gn:870},{g:3.9,b:8.0,a:8.1,gn:640},{g:4.2,b:8.7,a:8.6,gn:2210},{g:4.3,b:8.9,a:8.8,gn:760},{g:3.8,b:7.9,a:8.2,gn:430}];
const SRC={avg:"綜合平均",g:"Google 地圖",b:"Booking.com",a:"Agoda"};
let sortMode="dist";
const rate=(i,s)=>{const r=RT[i];return s==="g"?r.g:s==="b"?r.b/2:s==="a"?r.a/2:(r.g+r.b/2+r.a/2)/3};
function link(p,h){const n=encodeURIComponent(h.n),ci=$("#ci").value,co=$("#co").value,g=$("#ppl").value,nn=nights(),G="https://www.google.com/search?q=";
 return {trip:`https://www.trip.com/hotels/list?keyword=${n}&checkin=${ci}&checkout=${co}&adult=${g}`,
 booking:`https://www.booking.com/searchresults.html?ss=${n}&checkin=${ci}&checkout=${co}&group_adults=${g}&no_rooms=1`,
 agoda:`https://www.agoda.com/search?textToSearch=${n}&checkIn=${ci}&los=${nn}&rooms=1&adults=${g}`,
 ikyu:G+n+"+ikyu.com",official:G+n+"+官方網站"}[p.id]}
function copyText(t){
 const done=()=>toast("已複製：「"+t+"」，到訂房網貼上即可搜尋");
 const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("複製失敗，請手動複製："+t)}a.remove()};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb()}
let tt;function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),3500)}
document.addEventListener("click",e=>{const a=e.target.closest("a[data-copy]");if(a){const h=HOTELS[+a.dataset.copy];copyText($("#cn").value==="en"?h.n:h.l)}});
const $=s=>document.querySelector(s),out=$("#out");
const fmt=n=>"NT$"+Math.round(n).toLocaleString();
const iso=d=>d.toISOString().slice(0,10);
const t=new Date();t.setDate(t.getDate()+4);$("#ci").value=iso(t);t.setDate(t.getDate()+1);$("#co").value=iso(t);

function nights(){const n=(new Date($("#co").value)-new Date($("#ci").value))/864e5;return n>0?n:1}
function total(base,p,hi,ri){
  const v=1+((hi*7+ri*3+p.id.length)%5-2)*0.012; // 示範用的小幅價差
  let x=base*p.f*v*nights();
  const bathTax=30*$("#ppl").value*nights();
  if(!p.taxInc) x=x*1.10;
  return {sub:x,all:x+bathTax,bathTax};
}
function search(){
  const q=$("#q").value.trim();
  if(!/箱根|湯本|hakone|yumoto/i.test(q)){
    out.innerHTML='<p class="note">示範版目前只有「箱根湯本車站」的資料，請輸入箱根湯本車站。</p>';return}
  const ns=$("#ns").checked;
  const list=HOTELS.slice().sort((a,b)=>a.d-b.d).slice(0,10).map(h=>{
    const hi=HOTELS.indexOf(h);
    const rooms=ROOMS.filter(r=>!(ns&&r.smoke)&&!($("#fc").checked&&!r.fc));
    const r0=rooms[0]||ROOMS[0];
    const per=PLAT.map(p=>({p,...total(h.b*r0.m,p,hi,0)}));
    const min=per.reduce((a,b)=>a.all<b.all?a:b);
    return {h,hi,per,min,room:r0,rt:rate(hi,$('#rsrc').value)};
  });
  if(sortMode==='rate') list.sort((a,b)=>b.rt-a.rt||a.h.d-b.h.d);
  out.innerHTML=`<p class="note">${q} 附近 ${list.length} 間住宿（${sortMode==='rate'?'依評分高到低，評分來源：'+SRC[$('#rsrc').value]:'依距離由近到遠'}）・${$("#ppl").value} 位・${nights()} 晚・${ns?"禁菸房":"不限吸菸"}。顯示標準雙人房含稅總價，點選查看所有房型。</p>`
   +list.map((x,i)=>`<div class="panel hotel" role="button" tabindex="0" data-i="${x.hi}">
     <div><div class="hname">${x.h.n}</div><div class="meta">${x.h.l}</div><div class="meta">距車站約 ${x.h.d}m ・ ★ ${x.rt.toFixed(1)}／5（${SRC[$('#rsrc').value]}）・ ${x.room.n}</div></div>
     <div class="best"><div class="meta">最低含稅總價</div><b>${fmt(x.min.all)}</b><div class="meta">${x.min.p.name}</div><a class="cta" data-copy="${x.hi}" target="_blank" rel="noopener noreferrer" href="${link(x.min.p,x.h)}">前往 ${x.min.p.name} 訂房</a></div>
     <div class="plat">${x.per.map(y=>`<span class="${y===x.min?'lo':''}"><a data-copy="${x.hi}" target="_blank" rel="noopener noreferrer" href="${link(y.p,x.h)}">${y.p.name} ${fmt(y.all)}</a></span>`).join("")}</div>
   </div>`).join("");
  out.querySelectorAll(".hotel").forEach(b=>{const go=e=>{if(e.target.closest("a"))return;detail(+b.dataset.i)};b.onclick=go;b.onkeydown=e=>e.key==="Enter"&&go(e)});
}
function detail(hi){
  const h=HOTELS[hi],ns=$("#ns").checked;
  const rooms=ROOMS.filter(r=>!(ns&&r.smoke));
  const rows=rooms.map((r,ri)=>{
    const c=PLAT.map(p=>({p,...total(h.b*r.m,p,hi,ri)}));
    const m=Math.min(...c.map(x=>x.all));
    return `<tr><td>${r.n}${r.fc?'<span class="tag">可免費取消</span>':''}</td>${c.map(x=>`<td class="${x.all===m?'min':''}" title="稅前 ${fmt(x.sub)}＋入湯稅 ${fmt(x.bathTax)}">${fmt(x.all)}</td>`).join("")}</tr>`}).join("");
  out.innerHTML=`<p class="back"><button id="bk">← 返回列表</button></p>
   <div class="panel"><div class="hname">${h.n}</div><div class="meta">${h.l}</div>
   <div class="meta">評分：Google 地圖 ${RT[hi].g}／5（${RT[hi].gn.toLocaleString()} 則）・ Booking.com ${RT[hi].b}／10 ・ Agoda ${RT[hi].a}／10</div>
   <div class="meta">距箱根湯本車站約 ${h.d}m ・ ${$("#ci").value} ～ ${$("#co").value}（${nights()} 晚）・ ${$("#ppl").value} 位</div>
   <div class="scroll" style="margin-top:12px"><table><thead><tr><th>房型</th>${PLAT.map(p=>`<th><a data-copy="${hi}" target="_blank" rel="noopener noreferrer" href="${link(p,h)}">${p.name}</a><div class="meta">${p.taxInc?'含稅':'稅外加'}</div></th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
   <p class="fine">橘色為該房型含稅最低價。點平台名稱可前往該平台搜尋此飯店；滑過價格可看稅前金額與入湯稅。</p></div>`;
  $("#bk").onclick=search;
}
document.querySelectorAll("#sortseg button").forEach(b=>b.onclick=()=>{sortMode=b.dataset.m;document.querySelectorAll("#sortseg button").forEach(x=>x.setAttribute("aria-pressed",x===b));search()});
$("#go").onclick=search;$("#q").onkeydown=e=>e.key==="Enter"&&search();
["ci","co","ppl","ns","fc","rsrc"].forEach(i=>$("#"+i).onchange=search);
search();
</script>
</body>
</html>
